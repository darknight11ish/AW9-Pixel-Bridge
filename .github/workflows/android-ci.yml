name: Android CI & Sideload APK Builder

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Provision Android SDK Platform 36 (required by Health Connect 1.1.0)
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run JUnit Test Suite (BLE, Continuity, RMSSD, RSC)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Sideloadable Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Sideloadable Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AW9-Pixel-Bridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AW9-Pixel-Bridge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

  watchos-companion-typecheck:
    # The watchOS companion cannot be compiled on Linux, so it gets its own macOS
    # job. This is a real type-check against the watchOS SDK: it catches signature
    # errors (e.g. HKUnit.percent() misuse), not just syntax problems.
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Swift and watchOS SDK versions
        run: |
          swift --version
          xcrun --sdk watchos --show-sdk-path

      - name: Install XcodeGen 2.43.0
        # XcodeGen is deliberately installed rather than probed with
        # `command -v xcodegen`: it is not present on the macos runner images, so a
        # guarded step would silently pass forever and never verify project.yml.
        #
        # The version is PINNED to 2.43.0 on purpose, from the official release asset.
        # Measured on the runner: XcodeGen 2.44+ emits `objectVersion 77`, the Xcode 16
        # project format, which this image's Xcode 15.4 refuses to open at all
        # ("cannot be opened because it is in a future Xcode project file format (77)").
        # Neither `options.objectVersion` nor `options.compatibilityVersion` in
        # project.yml changes the emitted value, so the supported lever is the generator
        # version. 2.43.0 emits the older format that Xcode 15 and 16 both read.
        run: |
          set -o pipefail
          curl -fsSL -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
          XCODEGEN_BIN="$(find /tmp/xcodegen -type f -name xcodegen -perm -u+x | head -n 1)"
          if [ -z "$XCODEGEN_BIN" ]; then
            echo "::error::xcodegen binary not found in the release archive"
            exit 1
          fi
          echo "$(dirname "$XCODEGEN_BIN")" >> "$GITHUB_PATH"
          "$XCODEGEN_BIN" --version

      - name: Generate the watchOS Xcode project from project.yml
        run: |
          set -o pipefail
          cd watchos-companion
          xcodegen generate
          test -d WatchBridgeAgent.xcodeproj || {
            echo "xcodegen did not produce WatchBridgeAgent.xcodeproj" >&2
            exit 1
          }
          echo "Generated project:"
          ls -la WatchBridgeAgent.xcodeproj
          echo "Info.plist lint:"
          plutil -lint Info.plist

      - name: Verify the generated project carries the required watchOS settings
        # Guards the contract project.yml claims: a standalone, watch-only app whose only
        # transport is plain HTTP to the phone on :8484. If XcodeGen ever stops honouring
        # a key (or a target is dropped) the plist and settings would be wrong in ways
        # `xcodebuild` alone would not catch -- the app would build and then fail at
        # runtime on the watch.
        #
        # The checks key off `plutil` exit status rather than comparing captured output,
        # because the textual form of a boolean differs between `raw` and `json` (-extract
        # is documented as json/xml/raw). Status codes are unambiguous.
        run: |
          set -o pipefail
          cd watchos-companion

          require_key() {
            if ! plutil -extract "$1" raw -o /dev/null Info.plist >/dev/null 2>&1; then
              echo "::error::Info.plist is missing required key: $1"
              exit 1
            fi
            echo "  present: $1"
          }

          echo "--- Info.plist required keys ---"
          require_key WKApplication
          require_key WKWatchOnly
          require_key NSHealthShareUsageDescription
          require_key NSHealthUpdateUsageDescription

          # ATS must allow the plain-HTTP bridge on the LAN; `-extract ... raw` prints 1
          # for a true boolean.
          ats="$(plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw -o - Info.plist 2>/dev/null || true)"
          if [ "$ats" != "1" ] && [ "$ats" != "true" ]; then
            echo "::error::Info.plist must set NSAppTransportSecurity.NSAllowsArbitraryLoads (got '${ats:-none}')"
            exit 1
          fi
          echo "  NSAppTransportSecurity.NSAllowsArbitraryLoads = $ats"

          # The workout session must keep sampling with the wrist down.
          if ! plutil -extract UIBackgroundModes json -o - Info.plist 2>/dev/null | grep -q 'workout-processing'; then
            echo "::error::Info.plist must declare UIBackgroundModes = [workout-processing]"
            exit 1
          fi
          echo "  UIBackgroundModes includes workout-processing"

          echo "--- XcodeGen target identity ---"
          XCODEPROJ=WatchBridgeAgent.xcodeproj/project.pbxproj

          # Reading the scheme back also proves the project is actually openable.
          xcodebuild -project WatchBridgeAgent.xcodeproj -list

          grep -q 'SDKROOT = watchos' "$XCODEPROJ" || {
            echo "::error::the generated target is not a watchOS target"
            exit 1
          }
          echo "  SDKROOT = watchos"

          grep -q 'WATCHOS_DEPLOYMENT_TARGET = 10.0' "$XCODEPROJ" || {
            echo "::error::watchOS deployment target must be 10.0"
            exit 1
          }
          echo "  WATCHOS_DEPLOYMENT_TARGET = 10.0"

          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.bridge.applewatch.watchkitapp' "$XCODEPROJ" || {
            echo "::error::unexpected product bundle identifier"
            exit 1
          }
          echo "  PRODUCT_BUNDLE_IDENTIFIER = com.bridge.applewatch.watchkitapp"

      - name: Type-check the watchOS companion against the watchOS SDK
        run: |
          set -o pipefail
          SDK="$(xcrun --sdk watchos --show-sdk-path)"
          # -parse-as-library matches how Xcode compiles an app target; without it
          # swiftc treats the file as a script and rejects @main.
          # -target is required: passing only -sdk leaves the host (macOS) triple in
          # place, which then fails with "unable to load standard library".
          swiftc -typecheck -parse-as-library -sdk "$SDK" -target arm64-apple-watchos10.0 \
            watchos-companion/WatchBridgeAgent.swift
          echo "watchOS 10 type-check passed"

      - name: Verify the generated project format and build it
        # The type-check above is the authoritative Swift gate. This step additionally
        # proves the XcodeGen spec produces a project this runner's Xcode can consume.
        #
        # XcodeGen 2.44+ emits the newest project format it knows (objectVersion 77, the
        # Xcode 16 format), which the macos-14 image's Xcode 15.4 refuses outright:
        # "cannot be opened because it is in a future Xcode project file format (77)".
        # CI therefore pins XcodeGen 2.43.0 (see the install step). The emitted value is
        # read back and checked here rather than assumed, so a regression -- or a future
        # XcodeGen that ignores the pin -- fails loudly with a clear message instead of a
        # confusing "Unable to read project" error.
        run: |
          set -o pipefail
          cd watchos-companion

          # NOTE: deliberately no `| head` on `xcodebuild -version`. `head` exits after
          # the first line, and xcodebuild then dies on SIGPIPE with
          # "NSFileHandleOperationException ... Broken pipe", which intermittently fails
          # this step. awk reads all the input and selects the first line instead.
          OBJECT_VERSION="$(sed -n 's/.*objectVersion = \([0-9]*\);.*/\1/p' \
            WatchBridgeAgent.xcodeproj/project.pbxproj | awk 'NR==1')"
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1')"
          XCODE_MAJOR="$(echo "$XCODE_VERSION" | sed 's/Xcode //' | cut -d. -f1)"

          echo "Generated objectVersion: ${OBJECT_VERSION:-unknown}"
          echo "Runner Xcode: ${XCODE_VERSION:-unknown} (major $XCODE_MAJOR)"

          if [ -z "$OBJECT_VERSION" ]; then
            echo "::error::could not read objectVersion from the generated project"
            exit 1
          fi
          if [ "$OBJECT_VERSION" -gt 60 ]; then
            echo "::error::the generated project format is too new for Xcode $XCODE_MAJOR;" \
                 "objectVersion=$OBJECT_VERSION. Check the pinned XcodeGen version."
            exit 1
          fi

          xcodebuild -project WatchBridgeAgent.xcodeproj \
            -scheme WatchBridgeAgent \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # NOTE: `swift build --triple arm64-apple-watchos10.0` is deliberately NOT used
      # here. SwiftPM cannot locate the watchOS standard library without an Xcode
      # project, so it fails with "unable to load standard library" even though the
      # source is valid. Use xcodebuild against an .xcodeproj to produce a real
      # watchOS app bundle; the type-check above is the authoritative compile gate.
