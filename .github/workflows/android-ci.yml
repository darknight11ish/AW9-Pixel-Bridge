name: Android CI & Sideload APK Builder

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Provision Android SDK Platform 36 (required by Health Connect 1.1.0)
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run JUnit Test Suite (BLE, Continuity, RMSSD, RSC)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Sideloadable Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Sideloadable Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AW9-Pixel-Bridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AW9-Pixel-Bridge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

  watchos-companion-typecheck:
    # The watchOS companion cannot be compiled on Linux, so it gets its own macOS
    # job. This is a real type-check against the watchOS SDK: it catches signature
    # errors (e.g. HKUnit.percent() misuse), not just syntax problems.
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Swift and watchOS SDK versions
        run: |
          swift --version
          xcrun --sdk watchos --show-sdk-path

      - name: Type-check the watchOS companion against the watchOS SDK
        run: |
          set -o pipefail
          SDK="$(xcrun --sdk watchos --show-sdk-path)"
          # -parse-as-library matches how Xcode compiles an app target; without it
          # swiftc treats the file as a script and rejects @main.
          swiftc -typecheck -parse-as-library -sdk "$SDK" -target arm64-apple-watchos10.0 \
            watchos-companion/WatchBridgeAgent.swift
          echo "watchOS type-check passed"

      - name: Build the SwiftPM target for watchOS
        run: swift build --triple arm64-apple-watchos10.0 2>&1 | tail -n 25
